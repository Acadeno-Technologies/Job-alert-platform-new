<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Acadeno Technologies</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311068 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }
    .brand { text-align: center; margin-bottom: 24px; }
    .brand h1 { font-size: 22px; color: #5f2cff; font-weight: 700; }
    .brand p { color: #64748b; font-size: 13px; margin-top: 4px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 8px; }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: #5f2cff; }
    .btn {
      width: 100%;
      background: #5f2cff;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #4318ff; }
    .links { margin-top: 18px; text-align: center; }
    .links a { color: #5f2cff; text-decoration: none; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <h1>Reset Password</h1>
      <p>Enter your email to receive a password reset link.</p>
    </div>
    <form action="/forgot" method="POST">
      <div class="form-group">
        <label for="email">Account Email</label>
        <input type="email" id="email" name="email" placeholder="user@gmail.com" required>
      </div>
      <button type="submit" class="btn">Send Reset Link</button>
    </form>
    <div class="links">
      <a href="/">← Back to Login</a>
    </div>
  </div>
</body>
</html>
