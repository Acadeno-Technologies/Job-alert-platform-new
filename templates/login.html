<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Acadeno Technologies</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311068 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .brand {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand h1 {
      font-size: 26px;
      color: #5f2cff;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .brand p {
      color: #64748b;
      font-size: 14px;
      margin-top: 6px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 14px;
      transition: all 0.2s;
      outline: none;
    }
    input:focus {
      border-color: #5f2cff;
      box-shadow: 0 0 0 3px rgba(95, 44, 255, 0.15);
    }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #5f2cff 0%, #4318ff 100%);
      color: white;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(95, 44, 255, 0.4);
    }
    .btn:active {
      transform: translateY(0);
    }
    .links {
      margin-top: 20px;
      text-align: center;
    }
    .links a {
      color: #5f2cff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
    }
    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <h1>Acadeno Technologies</h1>
      <p>Job Alert Platform Portal</p>
    </div>
    <form action="/" method="POST">
      <div class="form-group">
        <label for="username">Email / Username</label>
        <input type="text" id="username" name="username" placeholder="acadenocareers@gmail.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn">Sign In</button>
    </form>
    <div class="links">
      <a href="/forgot">Forgot your password?</a>
    </div>
  </div>
</body>
</html>
